<title>Roteiro Marketing e Relacionamento</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: uma coluna estreita de celular, dias como blocos, cada post como linha com hora à esquerda */
:root{
  --bg:#f6f3ee; --surface:#ffffff; --fg:#1d1a16; --muted:#6f675c; --line:#e3ddd3;
  --gold:#a8741f; --gold-soft:#f3e6cc; --ok:#2f7d4f; --ok-soft:#dcefe3;
  --display:'Archivo',system-ui,sans-serif; --body:'IBM Plex Sans',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12100d; --surface:#1c1915; --fg:#f2ede4; --muted:#a39a8c; --line:#2e2a24;
  --gold:#e0ad55; --gold-soft:#3a2e19; --ok:#6cc792; --ok-soft:#1d3527; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12100d; --surface:#1c1915; --fg:#f2ede4; --muted:#a39a8c; --line:#2e2a24;
  --gold:#e0ad55; --gold-soft:#3a2e19; --ok:#6cc792; --ok-soft:#1d3527; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:20px 48px}
header h1{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.1;margin:0 0 6px;text-wrap:balance}
header p{margin:0;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:4px 10px;border-radius:999px}
.chip.auto{background:var(--ok-soft);color:var(--ok)}
.chip.man{background:var(--gold-soft);color:var(--gold)}
.progress{margin-top:14px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.picker{display:flex;gap:8px;align-items:center;margin:22px 0 14px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:2;padding-block:8px}
.picker select{flex:1;min-width:0;font:600 15px var(--body);padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.picker .nav{font:700 20px var(--body);width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.picker .nav:focus-visible,.picker select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.serie{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:22px 0 14px;padding-bottom:4px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:2;padding-top:8px}
.tabs button{flex:0 0 auto;font:600 13px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 12px;border-radius:10px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.tabs button:focus-visible,.btn:focus-visible,summary:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.day h2{font-family:var(--display);font-weight:700;font-size:19px;margin:0 0 10px}
.post{display:grid;grid-template-columns:58px 1fr;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.time{font-family:var(--display);font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
.body{min-width:0;display:flex;flex-direction:column;gap:8px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.tema{font-weight:600}
.titulo{color:var(--muted);font-size:14px;margin:0}
.pasta{font-size:13px;color:var(--muted);word-break:break-word}
.pasta a{color:var(--gold);font-weight:600;word-break:break-all}
.pasta code{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:var(--surface);border:1px solid var(--line);padding:1px 6px;border-radius:6px;color:var(--fg)}
details{background:var(--surface);border:1px solid var(--line);border-radius:10px}
summary{cursor:pointer;padding:8px 12px;font-size:13px;font-weight:600;color:var(--muted)}
pre{white-space:pre-wrap;word-break:break-word;margin:0;padding:0 12px 12px;font:14px/1.5 var(--body)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{font:600 14px var(--body);border-radius:10px;padding:10px 14px;cursor:pointer;border:1px solid var(--gold);background:var(--gold);color:var(--bg)}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn.done{background:var(--ok-soft);color:var(--ok);border-color:var(--ok-soft)}
.post.feito .tema,.post.feito .time{opacity:.5;text-decoration:line-through}
.autonote{font-size:13px;color:var(--ok)}
@media (prefers-reduced-motion:no-preference){.btn{transition:background .15s,color .15s}}
</style>

<div class="wrap">
  <header>
    <h1>Marketing e relacionamento no @odavidsa</h1>
    <p>__INTRO__</p>
    <div class="legend"><span class="chip auto">Automático</span></div>
    <div class="progress" id="progress"></div>
  </header>
  <nav class="picker" aria-label="Escolher dia"><button class="nav" id="prev" aria-label="Dia anterior">‹</button><select id="sel" aria-label="Dia"></select><button class="nav" id="next" aria-label="Próximo dia">›</button></nav>
  <main id="days"></main>
</div>

<script>
const DATA = __DATA__;
const KEY='roteiro-odavidsa-mkt-rel-feitos';
let feitos={};
try{feitos=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){feitos={}}
function salvar(){try{localStorage.setItem(KEY,JSON.stringify(feitos))}catch(e){}}
function hojeId(){const d=new Date();const iso=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');return DATA.some(x=>x.id===iso)?iso:DATA[0].id}
const sel=document.getElementById('sel'), days=document.getElementById('days');
DATA.forEach(d=>{const o=document.createElement('option');o.value=d.id;o.textContent=d.dia;sel.appendChild(o)});
sel.onchange=()=>render(sel.value);
document.getElementById('prev').onclick=()=>{const i=DATA.findIndex(d=>d.id===sel.value);if(i>0)render(DATA[i-1].id)};
document.getElementById('next').onclick=()=>{const i=DATA.findIndex(d=>d.id===sel.value);if(i<DATA.length-1)render(DATA[i+1].id)};
function progress(){
  const man=DATA.flatMap(d=>d.posts).filter(p=>!p.auto);
  const n=man.filter(p=>feitos[p.id]).length;
  document.getElementById('progress').textContent=`${n} de ${man.length} posts manuais marcados como postados`;
}
function render(sel){
  days.innerHTML=''; document.getElementById('sel').value=sel;
  const d=DATA.find(x=>x.id===sel);
  const sec=document.createElement('section'); sec.className='day';
  sec.innerHTML=`<h2>${d.dia}</h2>`;
  d.posts.forEach(p=>{
    const el=document.createElement('article'); el.className='post'+(feitos[p.id]?' feito':'');
    const t=document.createElement('div'); t.className='time'; t.textContent=p.hora.replace(':00','h').replace(':','h');
    const body=document.createElement('div'); body.className='body';
    const top=document.createElement('div'); top.className='top';
    top.innerHTML=`<span class="serie">${p.serie}</span><span class="tema"></span><span class="chip ${p.auto?'auto':'man'}">${p.auto?'Automático':'Manual'}</span>`;
    top.querySelector('.tema').textContent=p.tema;
    const tit=document.createElement('p'); tit.className='titulo'; tit.textContent=p.titulo;
    body.append(top,tit);
    if(p.auto){
      const n=document.createElement('div'); n.className='autonote'; n.textContent='Sai sozinho pelo Metricool. Não precisa fazer nada.';
      body.append(n);
    }else{
      const pa=document.createElement('div'); pa.className='pasta';
      if(p.link){pa.innerHTML='Fotos no GitHub: <a target="_blank" rel="noopener"></a> (6 imagens, na ordem 01 a 06)'; const a=pa.querySelector('a'); a.href=p.link; a.textContent=p.pasta;}
      else{pa.innerHTML='Fotos no Drive: <code></code> (6 imagens, na ordem 01 a 06)'; pa.querySelector('code').textContent=p.pasta;}
      const det=document.createElement('details'); det.innerHTML='<summary>Ver legenda</summary><pre></pre>';
      det.querySelector('pre').textContent=p.legenda;
      const act=document.createElement('div'); act.className='actions';
      const cp=document.createElement('button'); cp.className='btn'; cp.textContent='Copiar legenda';
      cp.onclick=async()=>{
        try{await navigator.clipboard.writeText(p.legenda); cp.textContent='Legenda copiada';}
        catch(e){det.open=true; const r=document.createRange(); r.selectNodeContents(det.querySelector('pre')); const s=getSelection(); s.removeAllRanges(); s.addRange(r); cp.textContent='Texto selecionado, copie';}
        setTimeout(()=>cp.textContent='Copiar legenda',2500);
      };
      const ok=document.createElement('button'); ok.className='btn ghost'+(feitos[p.id]?' done':'');
      ok.textContent=feitos[p.id]?'Postado ✓':'Marcar como postado';
      ok.onclick=()=>{feitos[p.id]=!feitos[p.id]; salvar(); render(sel); progress();};
      act.append(cp,ok);
      body.append(pa,det,act);
    }
    el.append(t,body); sec.appendChild(el);
  });
  days.appendChild(sec);
}
render(hojeId()); progress();
</script>
